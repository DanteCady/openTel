<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenTel First Call Demo</title>
  <style>
    body { font-family: system-ui; max-width: 600px; margin: 2rem auto; padding: 1rem; }
    input, button { padding: 0.5rem; margin: 0.25rem; }
    button { cursor: pointer; }
    .section { margin: 1.5rem 0; padding: 1rem; border: 1px solid #ccc; border-radius: 8px; }
    .log { background: #f5f5f5; padding: 0.5rem; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>OpenTel First Call</h1>
  <p>Use two browser tabs. Tab 1 = Alice, Tab 2 = Bob. Enter tokens and endpoint IDs from CLI.</p>

  <div class="section">
    <h3>1. Connect</h3>
    <input id="token" placeholder="Paste token" style="width: 100%;">
    <input id="endpointId" placeholder="Endpoint ID">
    <button id="connect">Connect & Register</button>
  </div>

  <div class="section">
    <h3>2. Call</h3>
    <input id="targetEndpointId" placeholder="Other endpoint ID (to dial)">
    <button id="dial">Dial</button>
  </div>

  <div class="section">
    <h3>3. Incoming / Answer</h3>
    <p id="incoming">Waiting for incoming call...</p>
    <button id="answer" disabled>Answer</button>
  </div>

  <div class="section">
    <h3>Events</h3>
    <div id="log" class="log"></div>
  </div>

  <script type="module">
    const API_URL = "http://localhost:3000";
    const WS_URL = "ws://localhost:3001";
    let ws = null;
    let currentCallId = null;

    const log = (msg) => {
      const el = document.getElementById("log");
      el.innerHTML = new Date().toISOString().slice(11, 19) + " " + msg + "\n" + el.innerHTML;
    };

    document.getElementById("connect").onclick = () => {
      const token = document.getElementById("token").value.trim();
      const endpointId = document.getElementById("endpointId").value.trim();
      if (!token || !endpointId) return alert("Token and endpoint ID required");

      ws = new WebSocket(WS_URL + "/ws");
      ws.onopen = () => {
        ws.send(JSON.stringify({ type: "auth", token }));
      };
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        log(JSON.stringify(msg));

        if (msg.type === "auth_ok") {
          ws.send(JSON.stringify({ type: "register", endpointId }));
        }
        if (msg.type === "registered") {
          log("Registered as " + endpointId);
        }
        if (msg.type === "incoming_call") {
          currentCallId = msg.callId;
          document.getElementById("incoming").textContent = "Incoming from " + msg.fromEndpointId;
          document.getElementById("answer").disabled = false;
        }
        if (msg.type === "call_created") {
          currentCallId = msg.callId;
        }
      };
    };

    document.getElementById("dial").onclick = () => {
      const target = document.getElementById("targetEndpointId").value.trim();
      if (!target || !ws || ws.readyState !== 1) return alert("Connect first and enter target");
      ws.send(JSON.stringify({ type: "dial", toEndpointId: target, metadata: { demo: "true" } }));
    };

    document.getElementById("answer").onclick = () => {
      if (!currentCallId || !ws || ws.readyState !== 1) return;
      const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:localhost:3478" }] });
      pc.createOffer().then(offer => {
        pc.setLocalDescription(offer);
        ws.send(JSON.stringify({ type: "answer", callId: currentCallId, sdp: offer.sdp }));
      });
      document.getElementById("answer").disabled = true;
      document.getElementById("incoming").textContent = "Answered";
    };
  </script>
</body>
</html>
